name: Build and Deploy Resume to GitHub Pages

on:
  push:
    branches:
      - master # Trigger the workflow when changes are pushed to the 'master' branch
  pull_request:
    branches:
      - master # Trigger the workflow on pull request to 'master'
  workflow_dispatch: # Allow the workflow to be triggered manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest # Use an Ubuntu runner

    steps:
      # Step 1: Checkout code to get the repository files
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up Pandoc
      - name: Set up Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      # Step 3: Create the HTML file from resume.md using pandoc and apply custom CSS
      - name: Build HTML from Markdown (resume.md)
        run: |
          pandoc -s -o index.html resume.md --css=style.css

      # Step 4: Configure Git for deployment
      - name: Set up Git for deployment
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      # Step 5: Deploy to gh-pages branch
      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # Deploy to the 'gh-pages' branch
          folder: . # The folder to deploy (root directory)
          token: ${{ secrets.GITHUB_TOKEN }} # Automatically provided token for authentication
          allow_empty_commit: true # Allows deployments even if there are no changes
          keep_files: true # Keeps current files on the gh-pages branch (optional)

